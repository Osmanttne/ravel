[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ravel-backend"
version = "0.2.0"
description = "Private Ravel checks with fixture and Gemini extraction adapters"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pillow>=12.0,<13",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1",
  "python-dotenv>=1.0,<2",
  "google-genai>=2.29,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx2>=2.13,<3", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.fixtures" = ["*.json", "*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

